<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English Notes</title>
  <meta name="theme-color" content="#2f5d50">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="top">
      <h1>English Notes</h1>
      <div class="tabs">
        <button data-view="list" class="active">목록</button>
        <button data-view="quiz">퀴즈</button>
        <button data-view="reading">읽기</button>
        <button data-view="settings">설정</button>
      </div>
    </div>
    <input id="search" type="search" placeholder="검색 (영어/뜻)" autocomplete="off">
    <div class="filters" role="tablist">
      <button data-type="all" class="active">전체</button>
      <button data-type="word">단어</button>
      <button data-type="idiom">숙어</button>
      <button data-type="phrase">표현</button>
    </div>
    <div class="actions" id="list-actions">
      <button id="play-all" class="play-all">▶ 전체 재생</button>
      <button id="sort" class="sort">최신순</button>
    </div>
  </header>
  <main id="list"></main>
  <main id="quiz" hidden></main>
  <main id="reading" hidden></main>
  <main id="settings" hidden>
    <article class="card">
      <h2 class="term">전체 재생 설정</h2>
      <label class="setting">단어·뜻 반복 횟수
        <select id="set-term"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      </label>
      <label class="setting">예문 반복 횟수 <span class="hint">(0 = 예문 안 읽기)</span>
        <select id="set-example"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      </label>
      <p class="note">목록 화면의 ▶ 전체 재생은 지금 보고 있는 탭(전체/단어/숙어/표현)과 검색 결과를 위에서부터 차례로 읽어줍니다.</p>
    </article>
  </main>
  <script src="app.js"></script>
</body>
</html>
